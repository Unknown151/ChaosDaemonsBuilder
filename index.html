<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Daemons — Army Builder</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#b8232a">
<style>
:root{
  --bg:#15110f; --panel:#221a16; --panel-2:#2c211b; --border:#3d2d24;
  --text:#ece3da; --muted:#a89384; --accent:#b8232a; --accent-2:#d4a13a;
  --core:#3f7fb8; --wg:#d4a13a; --inherited:#4caf6a; --strat:#e0b53a;
}
[data-theme="light"]{
  --bg:#efe7df; --panel:#fff; --panel-2:#f4ece4; --border:#d8c8ba;
  --text:#241a14; --muted:#6d5c4e; --accent:#9c1d23; --accent-2:#a87a16;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border-bottom:2px solid var(--accent);padding:.6rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0;letter-spacing:.04em;color:var(--accent-2);text-transform:uppercase;flex:1}
.tabs{display:flex;gap:.4rem}
.tab-btn{background:var(--panel-2);color:var(--muted);border:1px solid var(--border);
  padding:.45rem .9rem;border-radius:6px;cursor:pointer;font-weight:600}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.icon-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:6px;cursor:pointer;font-size:1.1rem}
main{max-width:1100px;margin:0 auto;padding:1rem}
.tab-panel{display:none}
.tab-panel.active{display:block}
#loading{text-align:center;padding:4rem 1rem;color:var(--muted)}

/* detachment selector */
.det-bar{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.8rem;margin-bottom:1rem}
.det-head{display:flex;align-items:center;gap:.6rem;cursor:pointer}
.det-current{flex:1;color:var(--accent-2);font-weight:700;font-size:.95rem}
.det-chevron{color:var(--muted);transition:transform .15s}
.det-bar.collapsed .det-chevron{transform:rotate(-90deg)}
.det-bar.collapsed .det-body{display:none}
.det-body{margin-top:.7rem}
.det-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.det-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:.35rem .7rem;border-radius:999px;cursor:pointer;font-size:.85rem}
.det-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.det-rule{font-size:.85rem;color:var(--muted)}
.rule-part{margin-top:.45rem}
.rule-part:first-child{margin-top:0}
.rule-part strong{color:var(--accent-2)}

/* points */
.points-bar{display:flex;align-items:center;gap:.8rem;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem;margin-bottom:1rem}
.points-total{font-size:1.3rem;font-weight:700}
.points-total.ok{color:var(--inherited)} .points-total.warn{color:var(--strat)} .points-total.over{color:var(--accent)}
.bar-track{flex:1;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent-2);width:0}

/* cards */
.unit-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  margin-bottom:.8rem;overflow:hidden}
.unit-card.attached{border-color:var(--accent-2)}
.unit-card{scroll-margin-top:64px}
.card-head{display:flex;align-items:flex-start;gap:.6rem;padding:.8rem .9rem;cursor:pointer;
  background:var(--panel-2)}
.card-head h3{margin:.1rem 0 0;font-size:1.5rem;font-weight:800;flex:1;letter-spacing:.01em;line-height:1.1}
.card-head .pts{color:var(--accent-2);font-weight:700;font-size:.85rem;white-space:nowrap}
.card-body{padding:.7rem .9rem .9rem}
.unit-card.collapsed .card-body{display:none}

/* stat tiles (label over value) */
.stat-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 .8rem}
.stat{flex:1;min-width:62px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;padding:.45rem .3rem;text-align:center}
.stat b{display:block;color:var(--muted);font-size:.62rem;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:.18rem}
.stat .sv{font-size:1.35rem;font-weight:700;line-height:1}
.stat.hl{background:rgba(212,161,58,.14);border-color:var(--accent-2)}
.stat.hl .sv,.stat.hl b{color:var(--accent-2)}
.card-head .collapse-ind{color:var(--muted);font-size:.8rem;transition:transform .15s}
.unit-card.collapsed .collapse-ind{transform:rotate(-90deg)}
.role-eyebrow{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.card-type{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:.15rem}
.model-line{font-size:.78rem;color:var(--muted);margin:.1rem 0 .5rem}
.defence-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.invuln-row{display:inline-block;background:rgba(212,161,58,.15);border:1px solid var(--accent-2);
  color:var(--accent-2);border-radius:5px;padding:.15rem .5rem;font-size:.78rem}
.invuln-row.fnp-only,.fnp-row{background:rgba(76,175,106,.12);border:1px solid var(--inherited);color:var(--inherited)}
.fnp-row{display:inline-block;border-radius:5px;padding:.15rem .5rem;font-size:.78rem}
.prof-name{color:var(--accent-2);font-weight:600;font-size:.72rem;margin-right:.3rem}
.wpn-name small{color:var(--muted)}
.enh-box{background:rgba(212,161,58,.1);border:1px solid var(--accent-2);border-radius:6px;
  padding:.4rem .6rem;margin:.5rem 0;font-size:.8rem}
.enh-box .enh-name{color:var(--accent-2);font-weight:700;cursor:pointer}
.kw-line{margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--border);
  font-size:.68rem;color:var(--muted);letter-spacing:.03em}
.kw-line b{color:var(--muted)}
.wgo{font-size:.8rem;color:var(--muted);margin:.15rem 0}
.led-by{font-size:.8rem;color:var(--muted);margin-top:.5rem}
.led-by b{color:var(--accent-2)}
.sec-label{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:.5rem 0 .2rem}
.ag-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.ag-tile{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
  padding:.6rem;cursor:pointer;color:var(--text);text-align:left;display:flex;flex-direction:column;
  gap:.35rem;min-height:92px}
.ag-tile:hover{border-color:var(--accent-2)}
.ag-tile.active{border-color:var(--accent-2);background:rgba(212,161,58,.14)}
.agt-name{font-weight:700;color:var(--accent-2);font-size:.84rem;line-height:1.15}
.agt-short{font-size:.74rem;color:var(--muted);line-height:1.3}
@media(max-width:480px){.ag-tiles{grid-template-columns:1fr}}
.damaged-note{font-size:.78rem;color:var(--accent);margin:.3rem 0 .5rem}
/* weapon sections (banded, label-over-value stat grid) */
.wpn-section{margin:.6rem 0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.wpn-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;font-size:.72rem;
  font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--panel-2);
  border-left:4px solid var(--muted)}
.wpn-header.ranged{border-left-color:var(--core);color:var(--core);
  background:linear-gradient(90deg,rgba(63,127,184,.16),var(--panel-2) 60%)}
.wpn-header.melee{border-left-color:var(--accent);color:var(--accent);
  background:linear-gradient(90deg,rgba(184,35,42,.16),var(--panel-2) 60%)}
.wpn-entry{padding:.55rem .7rem;border-top:1px solid var(--border)}
.wpn-entry:first-of-type{border-top:none}
.wpn-name{font-size:.95rem;margin-bottom:.4rem}
.wpn-name small{color:var(--muted);font-size:.78rem}
.wpn-stats{display:flex}
.wpn-stats .ws{flex:1;text-align:center;padding:.1rem .2rem;border-left:1px solid var(--border)}
.wpn-stats .ws:first-child{border-left:none}
.wpn-stats .ws b{display:block;color:var(--muted);font-size:.6rem;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:.15rem}
.wpn-stats .ws span{font-size:.95rem}
.skill-note{font-size:.68rem;color:var(--muted);font-style:italic;margin:.1rem 0 .3rem}
.badges{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.ab,.wab{font-size:.7rem;padding:.12rem .45rem;border-radius:4px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--border)}
.ab.core{border-color:var(--core);color:var(--core)}
.ab.wg{border-color:var(--wg);color:var(--wg)}
.wab{border-color:var(--accent-2);color:var(--accent-2)}
.wab.inherited{border-color:var(--inherited);color:var(--inherited);border-style:dashed}
.card-section{border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;margin:.6rem 0;background:rgba(0,0,0,.14)}
.card-section .section-label{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);font-weight:700;margin-bottom:.3rem}
.card-section h4{margin:.1rem 0 .5rem;font-size:1.1rem;font-weight:700}
.card-section .enh-name{color:var(--accent-2);font-size:.82rem;cursor:pointer}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--accent-2);border-radius:10px;
  max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:1.2rem}
.modal h2{margin:.1rem 0;color:var(--accent-2)}
.modal .sub{color:var(--muted);font-size:.8rem;margin-bottom:.8rem}
.modal .close{float:right;cursor:pointer;color:var(--muted);font-size:1.3rem;line-height:1}
.empty{color:var(--muted);text-align:center;padding:2rem}

/* builder controls */
.config-label{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:.6rem 0 .3rem}
.leader-select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--accent-2);
  border-radius:6px;padding:.5rem;font-size:.9rem;font-weight:600;cursor:pointer}
.leader-bonus-box{margin-top:.5rem;background:rgba(76,175,106,.1);border:1px solid var(--inherited);
  border-left-width:4px;border-radius:6px;padding:.45rem .6rem}
.lb-label{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--inherited);font-weight:700}
.lb-body{font-size:.88rem;margin-top:.15rem}
.lb-grant{color:var(--inherited);font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:.6rem;background:var(--panel-2);
  border:1px solid var(--border);border-radius:6px;padding:.2rem .4rem}
.stepper button{width:28px;height:28px;border:none;border-radius:4px;background:var(--accent);
  color:#fff;font-size:1.1rem;cursor:pointer;line-height:1}
.stepper button:disabled{background:var(--border);cursor:default;opacity:.5}
.stepper .val{min-width:2.4rem;text-align:center;font-weight:600}
.enh-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.enh-chip{display:inline-flex;align-items:center;gap:.5rem;background:var(--panel-2);
  border:1px solid var(--border);border-radius:6px;padding:.3rem .6rem;cursor:pointer;color:var(--text);text-align:left}
.enh-chip:hover{border-color:var(--accent-2)}
.enh-chip.active{border-color:var(--accent-2);background:rgba(212,161,58,.14)}
.enh-chip.active .ec-short{color:var(--accent-2)}
.ec-short{font-size:.82rem}
.ec-pts{font-size:.72rem;color:var(--accent-2);font-weight:700;white-space:nowrap}
.ed-desc{font-size:.86rem;color:var(--text);margin-top:.3rem}
.eo-restr{font-size:.74rem;color:var(--muted);font-style:italic;margin-top:.15rem}
.wargear-exclusive-option,.wargear-choice{display:block;padding:.3rem .5rem;border:1px solid var(--border);
  border-radius:5px;margin-bottom:.3rem;cursor:pointer;font-size:.85rem}
.wargear-exclusive-option.selected,.wargear-choice.checked{border-color:var(--accent-2);background:rgba(212,161,58,.1)}
.cfg-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.btn{background:var(--accent);color:#fff;border:none;padding:.45rem .9rem;border-radius:6px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
.limit-input{width:5.5rem;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:5px;padding:.3rem .4rem}
.config-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:.8rem;position:relative}
.config-card.menu-open{z-index:30}
.config-card .cc-head{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;cursor:pointer}
.config-card .cc-title{flex:1;min-width:0}
.config-card .cc-head h3{margin:0;font-size:1.1rem;font-weight:800;color:var(--accent-2)}
.cc-loadout{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.pts-badge{border:1px solid var(--accent-2);color:var(--accent-2);font-weight:700;font-size:.8rem;
  border-radius:6px;padding:.2rem .5rem;white-space:nowrap}
.cc-kebab,.cc-chevron{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:1rem;line-height:1;flex:none}
.cc-chevron{transition:transform .15s}
.config-card.collapsed .cc-chevron{transform:rotate(180deg)}
.config-card.collapsed .cc-body{display:none}
.cc-body{padding:0 .7rem .7rem}
.cc-menu{position:relative}
.cc-menu-pop{position:absolute;right:0;top:38px;z-index:10;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden}
.cc-menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
  padding:.55rem .8rem;cursor:pointer;font-size:.85rem}
.cc-menu-pop button:hover{background:var(--panel-2)}
.cc-menu-pop button.danger{color:var(--accent)}

.models-row{display:flex;align-items:center;gap:.6rem;margin:.5rem 0 .2rem}
.models-row .config-label{margin:0}
.stepper.sm button{width:26px;height:26px;font-size:1rem}
.stepper.sm .val{min-width:1.8rem}

.wgrp-label{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:.7rem 0 .25rem}
.wrow{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-top:1px solid var(--border)}
.wrow:first-of-type{border-top:none}
.wchk{flex:none;display:flex;align-items:center}
.wchk input{width:18px;height:18px;accent-color:var(--accent-2);cursor:pointer}
.wrow-name{flex:1;min-width:0;color:var(--accent-2);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow.off .wrow-name{color:var(--muted);text-decoration:line-through}
.wrow-ctrl{display:flex;align-items:center;gap:.4rem;flex:none}
.wexpand{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;
  border-radius:6px;cursor:pointer;transition:transform .15s}
.wexpand.open{transform:rotate(180deg);color:var(--accent-2)}
.wdetail{padding:.4rem .2rem .5rem 2rem;border-top:1px dashed var(--border)}
.picker-search{width:100%;padding:.5rem;margin-bottom:.4rem;background:var(--panel-2);
  border:1px solid var(--border);color:var(--text);border-radius:6px}
.pick-cat{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  margin:1.1rem 0 0;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.pick-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.7rem .25rem;border-bottom:1px solid var(--border);cursor:pointer}
.pick-row:hover{background:var(--panel-2)}
.pick-name{font-size:.95rem}
.pick-pts{color:var(--accent-2);font-weight:700;font-size:.85rem;white-space:nowrap}
.pick-divider{display:flex;align-items:center;gap:.6rem;margin:1.3rem 0 .2rem;
  font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick-divider::before,.pick-divider::after{content:"";flex:1;height:1px;background:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Chaos Daemons</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="units">Units</button>
    <button class="tab-btn" data-tab="config">Builder</button>
  </nav>
  <button class="icon-btn" id="theme-btn" title="Toggle theme">◐</button>
</header>

<main>
  <div id="loading">Loading Chaos Daemons data…</div>

  <section id="units-tab" class="tab-panel active"></section>

  <section id="config-tab" class="tab-panel">
    <div class="det-bar" id="det-bar"></div>
    <div class="points-bar" id="points-bar"></div>
    <div id="config-list"></div>
  </section>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <span class="close" onclick="closeModal()">×</span>
    <h2 id="modal-title"></h2>
    <div class="sub" id="modal-sub"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* ===================================================================== *
 *  Chaos Daemons Army Builder — Stage 2 shell (data load + scaffolding) *
 * ===================================================================== */
const LS = 'chaos-daemons-';

/* ---- Loaded data ---- */
let abilities = {}, enhancements = {}, detachments = {}, units = {}, defaultArmy = {};

/* ---- Army state ---- */
let armyList = [];
let nextInstanceId = 1;
let selectedDetachment = 'blood-legion';
let pointsLimit = 0;

/* ---- UI state ---- */
let stratagemState = {};
let characterState = {}, bodyguardState = {};
let expandedCards = {}, configExpandedCards = {};
let weaponDetailOpen = {}, menuOpenId = null;
let detExpanded = true;

/* ---- Constants (built at load) ---- */
let ALL_UNIT_IDS = [];
let UNIT_GROUPS = {};
const DETACHMENTS = {}; // filled from detachments.json

/* ===================== Data loading ===================== */
async function loadData(){
  // cache-bust data with the build version so updates always load fresh
  let ver = '';
  try { ver = (await (await fetch('data/version.json', {cache:'no-store'})).json()).v; } catch(e){}
  const bust = ver ? ('?v=' + ver) : '';
  const j = async p => (await fetch(p + bust, {cache:'no-cache'})).json();
  const [ab, enh, det, army, manifest] = await Promise.all([
    j('data/abilities.json'), j('data/enhancements.json'), j('data/detachments.json'),
    j('data/army.json'), j('data/units-manifest.json'),
  ]);
  abilities = ab; enhancements = enh; detachments = det; defaultArmy = army;
  Object.assign(DETACHMENTS, det);
  ALL_UNIT_IDS = manifest;

  const unitObjs = await Promise.all(ALL_UNIT_IDS.map(id => j(`data/units/${id}.json`)));
  unitObjs.forEach(u => { units[u.id] = u; });

  buildUnitGroups();
  initStratagemState();
  restoreState();
  document.getElementById('loading').style.display = 'none';
  renderApp();
}

function buildUnitGroups(){
  const groups = { 'Characters':[], 'Battleline':[], 'Infantry':[], 'Vehicles & Mounted':[], 'Other':[] };
  ALL_UNIT_IDS.forEach(id => {
    const u = units[id]; if(!u) return;
    const k = u.keywords.map(x=>x.toUpperCase());
    if(k.includes('CHARACTER')) groups['Characters'].push(id);
    else if(u.isBattleline) groups['Battleline'].push(id);
    else if(k.includes('VEHICLE')||k.includes('MOUNTED')||k.includes('MONSTER')||k.includes('CAVALRY')) groups['Vehicles & Mounted'].push(id);
    else if(k.includes('INFANTRY')) groups['Infantry'].push(id);
    else groups['Other'].push(id);
  });
  Object.keys(groups).forEach(g=>{ if(!groups[g].length) delete groups[g];
    else groups[g].sort((a,b)=>units[a].name.localeCompare(units[b].name)); });
  UNIT_GROUPS = groups;
}

function initStratagemState(){
  stratagemState = {};
  Object.values(detachments).forEach(d => d.stratagems.forEach(s => { stratagemState[s.id] = false; }));
}

/* ===================== Persistence ===================== */
function saveState(){
  localStorage.setItem(LS+'detachment', selectedDetachment);
  localStorage.setItem(LS+'army', JSON.stringify({ armyList, nextInstanceId, pointsLimit }));
}
function restoreState(){
  selectedDetachment = localStorage.getItem(LS+'detachment') || defaultArmy.detachment || 'blood-legion';
  const saved = localStorage.getItem(LS+'army');
  if(saved){
    try{ const s = JSON.parse(saved); armyList = s.armyList||[]; nextInstanceId = s.nextInstanceId||1; pointsLimit = s.pointsLimit||0; }
    catch(e){ loadDefaultArmy(); }
  } else loadDefaultArmy();
  const theme = localStorage.getItem(LS+'theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  detExpanded = localStorage.getItem(LS+'det-expanded') !== '0';
}
function loadDefaultArmy(){
  armyList = []; nextInstanceId = 1;
  pointsLimit = defaultArmy.pointsLimit || 0;
  selectedDetachment = defaultArmy.detachment || 'blood-legion';
  (defaultArmy.units||[]).forEach(u => addInstance(u.unitId, false));
}

/* ===================== Army instance helpers ===================== */
function addInstance(unitId, save=true){
  const u = units[unitId]; if(!u) return;
  armyList.push(normalizeInstance({ instanceId:'inst-'+(nextInstanceId++), unitId }));
  if(save){ saveState(); renderApp(); }
}
function removeInstance(instanceId){
  armyList = armyList.filter(i => i.instanceId !== instanceId);
  menuOpenId = null; saveState(); renderApp();
}
function duplicateInstance(instanceId){
  const idx = armyList.findIndex(i => i.instanceId === instanceId);
  if(idx < 0) return;
  const copy = JSON.parse(JSON.stringify(armyList[idx]));
  copy.instanceId = 'inst-' + (nextInstanceId++);
  copy.enhancementId = null;   // enhancements are once-per-army — don't clone
  armyList.splice(idx + 1, 0, copy);
  menuOpenId = null; saveState(); renderApp();
}
function normalizeInstance(inst){
  const u = units[inst.unitId] || {};
  return Object.assign({
    instanceId: inst.instanceId, unitId: inst.unitId,
    modelCount: u.models || u.baseModels || 1,
    weapons: {}, leaderId: null, leaderWargear: [],
    enhancementId: null, selectedWargear: [], abilityChoices: {},
  }, inst);
}

/* ===================== Points ===================== */
function calculateInstancePoints(inst){
  const u = units[inst.unitId]; if(!u) return 0;
  let pts = u.points || 0;
  if(u.modelBrackets && u.modelBrackets.length){
    // priced by bracket — use the highest bracket whose size is <= modelCount
    let b = u.modelBrackets[0];
    for(const br of u.modelBrackets) if(inst.modelCount >= br.models) b = br;
    pts = b.points;
  } else if(u.maxModels && inst.modelCount > u.baseModels){
    pts *= Math.ceil(inst.modelCount / u.baseModels);
  }
  if(inst.enhancementId && enhancements[inst.enhancementId]) pts += enhancements[inst.enhancementId].points;
  if(inst.leaderId && units[inst.leaderId]) pts += units[inst.leaderId].points || 0;
  return pts;
}
function totalPoints(){ return armyList.reduce((s,i)=>s+calculateInstancePoints(i),0); }

/* ===================== Rendering pipeline ===================== */
function renderApp(){
  loadDetachment();
  renderDetachmentSelector();
  renderUnits();
  renderConfigurationTab();
}
function loadDetachment(){
  if(!detachments[selectedDetachment]) selectedDetachment = Object.keys(detachments)[0];
}
function selectDetachment(id){
  selectedDetachment = id;
  // clear enhancements that don't belong to the new detachment
  armyList.forEach(i => { if(i.enhancementId && enhancements[i.enhancementId] &&
    enhancements[i.enhancementId].detachment !== id) i.enhancementId = null; });
  initStratagemState();
  saveState(); renderApp();
}

/* ---- Detachment selector ---- */
function renderDetachmentSelector(){
  const d = detachments[selectedDetachment];
  const bar = document.getElementById('det-bar');
  bar.classList.toggle('collapsed', !detExpanded);
  bar.innerHTML =
    `<div class="det-head" onclick="toggleDetachment()">
      <span class="config-label" style="margin:0">Detachment</span>
      <span class="det-current">${d.name}</span>
      <span class="det-chevron">▾</span>
    </div>
    <div class="det-body">
      <div class="det-grid">` +
      Object.values(detachments).map(x =>
        `<button class="det-btn ${x.id===selectedDetachment?'active':''}" onclick="event.stopPropagation();selectDetachment('${x.id}')">${x.name}</button>`
      ).join('') + `</div>` +
      `<div class="det-rule">${renderRuleParts(d)}</div>
    </div>`;
}

function toggleDetachment(){
  detExpanded = !detExpanded;
  localStorage.setItem(LS+'det-expanded', detExpanded ? '1' : '0');
  renderDetachmentSelector();
}
function renderRuleParts(d){
  const parts = d.ruleParts && d.ruleParts.length ? d.ruleParts
    : [{name:d.ruleName, text:d.ruleDescription}];
  return parts.map(p=>`<div class="rule-part"><strong>${p.name}:</strong> ${p.text}</div>`).join('');
}

/* ---- Points bar ---- */
function updateConfigPoints(){
  const bar = document.getElementById('points-bar');
  const tot = totalPoints();
  let cls = 'ok', pct = 0;
  if(pointsLimit > 0){
    pct = Math.min(100, tot/pointsLimit*100);
    cls = tot > pointsLimit ? 'over' : (tot > pointsLimit*0.95 ? 'warn' : 'ok');
  } else cls = '';
  bar.innerHTML =
    `<span class="points-total ${cls}">${tot}${pointsLimit?` / ${pointsLimit}`:''} pts</span>` +
    (pointsLimit?`<div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`:
      `<span style="color:var(--muted);font-size:.8rem">no points limit set</span>`);
}

/* ---- Units tab (full unit cards) ---- */
function renderUnits(){
  const el = document.getElementById('units-tab');
  if(!armyList.length){ el.innerHTML = `<div class="empty">No units yet. Add some in the <b>Builder</b> tab.</div>`; return; }
  // sort cards alphabetically by unit name
  const sorted = armyList.slice().sort((a,b)=>units[a.unitId].name.localeCompare(units[b.unitId].name));
  el.innerHTML = sorted.map(inst =>
    (inst.leaderId && units[inst.leaderId]) ? renderLedUnitCard(inst) : renderSoloUnitCard(inst)
  ).join('');
}

function renderLedUnitCard(inst){
  const bg = units[inst.unitId], leader = units[inst.leaderId];
  if(!bg || !leader) return renderSoloUnitCard(inst);
  const collapsed = expandedCards[inst.instanceId] ? '' : 'collapsed';
  const enh = inst.enhancementId ? enhancements[inst.enhancementId] : null;

  // bodyguard copy with the leader's granted abilities injected as inherited
  const displayBg = JSON.parse(JSON.stringify(bg));
  const lb = leader.leaderBonus;
  if(lb && (lb.grantsAbilities||[]).length){
    ['ranged','melee'].forEach(cat=>{
      (displayBg.weapons[cat]||[]).forEach(w=>{
        lb.grantsAbilities.forEach(g=>{
          const ap = (typeof g==='object' && g.abilityAppliesTo) ? g.abilityAppliesTo : (lb.appliesTo||null);
          if(!ap || ap===cat){ (w.inheritedAbilities=w.inheritedAbilities||[]).push(g); }
        });
      });
    });
  }

  const section = (label, u, opts={}) => `<div class="card-section">
      <div class="section-label">${label}</div>
      <h4>${u.name}${opts.enh?` <span class="enh-name" onclick="showModal('${inst.enhancementId}')">✦ ${opts.enh.name}</span>`:''}</h4>
      ${renderStatGrid(u)}
      ${renderDefence(u)}
      ${renderWeapons(u, opts.inst||null)}
      ${renderAbilities(u, null, opts.inst||null)}
    </div>`;

  return `<div class="unit-card attached ${collapsed}" id="uc-${inst.instanceId}">
    <div class="card-head" onclick="toggleCard('${inst.instanceId}')">
      <span class="collapse-ind">▼</span>
      <div style="flex:1">
        <div class="role-eyebrow">— Led Unit</div>
        <h3>${bg.name} <span style="color:var(--muted);font-weight:600;font-size:1rem">+ ${leader.name}</span></h3>
      </div>
      <span class="pts">${calculateInstancePoints(inst)} pts</span>
    </div>
    <div class="card-body">
      ${section('Leader', leader, {enh})}
      ${section('Bodyguard', displayBg, {inst})}
      ${renderLeaderBonus(leader)}
      <div class="kw-line"><b>Keywords:</b> ${(bg.keywords||[]).join(', ')}${(bg.factionKeywords||[]).length?` &nbsp;·&nbsp; <b>Faction:</b> ${bg.factionKeywords.join(', ')}`:''}</div>
    </div></div>`;
}

function renderSoloUnitCard(inst){
  const u = units[inst.unitId]; if(!u) return '';
  const collapsed = expandedCards[inst.instanceId] ? '' : 'collapsed';
  const enh = inst.enhancementId ? enhancements[inst.enhancementId] : null;
  return `<div class="unit-card ${collapsed}" id="uc-${inst.instanceId}">
    <div class="card-head" onclick="toggleCard('${inst.instanceId}')">
      <span class="collapse-ind">▼</span>
      <div style="flex:1">
        ${roleEyebrow(u)}
        <h3>${u.name}</h3>
        <div class="card-type">${(u.type||[]).join(' · ')}</div>
      </div>
      <span class="pts">${calculateInstancePoints(inst)} pts</span>
    </div>
    <div class="card-body">
      <div class="model-line">Models: <b style="color:var(--text)">${inst.modelCount}</b></div>
      ${renderStatGrid(u)}
      ${renderDefence(u)}
      ${u.damagedProfile?`<div class="damaged-note"><b>Damaged (${u.damagedProfile} wounds):</b> ${u.damagedText||''}</div>`:''}
      ${enh?`<div class="enh-box"><span class="enh-name" onclick="showModal('${inst.enhancementId}')">✦ ${enh.name}</span> — ${enh.type}</div>`:''}
      ${renderWeapons(u, inst)}
      ${u.skillEstimated?`<div class="skill-note">≈ BS/WS estimated — not in source data; verify before play.</div>`:''}
      ${renderAbilities(u, enh, inst)}
      ${ledByLine(u)}
      <div class="kw-line"><b>Keywords:</b> ${(u.keywords||[]).join(', ')}${(u.factionKeywords||[]).length?` &nbsp;·&nbsp; <b>Faction:</b> ${u.factionKeywords.join(', ')}`:''}</div>
    </div></div>`;
}

function ledByLine(u){
  const names = arr => arr.map(id=>units[id]?units[id].name:id).join(', ');
  if((u.canBeLeadBy||[]).length)
    return `<div class="led-by"><b>Led by:</b> ${names(u.canBeLeadBy)}</div>`;
  if((u.canLead||[]).length)
    return `<div class="led-by"><b>Can lead:</b> ${names(u.canLead)}</div>`;
  return '';
}
function roleEyebrow(u){
  let role = '';
  if(u.isEpicHero) role = 'Epic Hero';
  else if(u.isLeader) role = 'Leader';
  else if(u.isBattleline) role = 'Battleline';
  return role ? `<div class="role-eyebrow">— ${role}</div>` : '';
}

function renderStatGrid(u){
  const order = [['M','m'],['T','t'],['SV','sv'],['W','w'],['LD','ld'],['OC','oc']];
  const row = s => `<div class="stat-grid">` +
    order.map(([k,p])=>`<div class="stat ${p==='w'?'hl':''}"><b>${k}</b><span class="sv">${s[p]??'-'}</span></div>`).join('') + `</div>`;
  if(u.modelProfiles && u.modelProfiles.length > 1){
    return u.modelProfiles.map(mp=>`<div class="prof-name">${mp.name}</div>${row(mp.stats)}`).join('');
  }
  return row(u.stats||{});
}

function renderDefence(u){
  const parts = [];
  if(u.invulnerableSave){
    const cls = (u.weapons && !u.invulnerableSource) ? '' : '';
    parts.push(`<span class="invuln-row" ${u.invulnerableSource?`onclick="showModal('${u.invulnerableSource}')"`:''}>Invulnerable Save ${u.invulnerableSave}</span>`);
  }
  const fnp = (u.coreAbilities||[]).find(id=>id.startsWith('feel-no-pain'));
  if(fnp){
    const a = abilities[fnp];
    parts.push(`<span class="fnp-row" onclick="showModal('${fnp}')">${a?a.name:'Feel No Pain'}</span>`);
  }
  return parts.length ? `<div class="defence-row">${parts.join('')}</div>` : '';
}

function renderWeapons(u, inst){
  let out = '';
  for(const [cat,label] of [['ranged','Ranged Weapons'],['melee','Melee Weapons']]){
    let list = (u.weapons&&u.weapons[cat])||[];
    // honour the instance loadout — only show equipped weapons
    if(inst) list = list.filter(w => weaponState(inst, u, w).equipped);
    if(!list.length) continue;
    out += `<div class="wpn-section"><div class="wpn-header ${cat}">${label}</div>`;
    out += list.map(w=>{
      const c = inst ? weaponState(inst, u, w).count
                     : (u.baseModels && w.count === u.baseModels ? u.models : w.count);
      const cnt = (c && c > 1) ? ` <small>×${c}</small>` : '';
      const model = w.model ? ` <small>(${w.model})</small>` : '';
      const torrent = (w.abilities||[]).includes('torrent');
      const cols = cat==='ranged'
        ? [['RNG',w.range||'-'],['A',w.a],['BS',torrent?'N/A':(w.bs||'-')],['S',w.s],['AP',w.ap],['D',w.d]]
        : [['A',w.a],['WS',w.ws||'-'],['S',w.s],['AP',w.ap],['D',w.d]];
      return `<div class="wpn-entry">
        <div class="wpn-name">${w.name}${cnt}${model}${renderWeaponBadges(w)}</div>
        <div class="wpn-stats">` +
        cols.map(([k,v])=>`<div class="ws"><b>${k}</b><span>${v}</span></div>`).join('') +
        `</div></div>`;
    }).join('');
    out += `</div>`;
  }
  return out;
}

function renderWeaponBadges(w){
  const all = [];
  (w.abilities||[]).forEach(id=>all.push({id, cls:''}));
  (w.inheritedAbilities||[]).forEach(x=>{ const id = typeof x==='string'?x:x.id; all.push({id, cls:'inherited', display:(typeof x==='object'?x.display:null)}); });
  if(!all.length) return '';
  return ` <span class="badges">` + all.map(b=>{
    const a = abilities[b.id];
    const label = b.display || (a?a.name:b.id);
    return `<span class="wab ${b.cls}" onclick="event.stopPropagation();showModal('${b.id}')">${label}</span>`;
  }).join('') + `</span>`;
}

function renderAbilities(u, enh, inst){
  const chip = (id,cls)=>{ const a=abilities[id]; return `<span class="ab ${cls}" onclick="showModal('${id}')">${a?a.name:id}</span>`; };
  let out = '';
  if((u.coreAbilities||[]).length){
    out += `<div class="sec-label">Core</div><div class="badges">` +
      u.coreAbilities.map(id=>chip(id,'core')).join('') + `</div>`;
  }
  if((u.abilities||[]).length){
    out += `<div class="sec-label">Abilities</div><div class="badges">` +
      u.abilities.map(id=>chip(id,'')).join('') + `</div>`;
  }
  // Wargear is configured/shown in the Builder tab, not here.
  (u.abilityGroups||[]).forEach((g,gi)=>{
    const chosen = inst && inst.abilityChoices ? inst.abilityChoices[gi] : null;
    out += `<div class="sec-label">${g.label}</div><div class="ag-tiles">`;
    out += g.options.map(opt=>{
      const id = typeof opt==='string' ? opt : opt.id;
      const short = (typeof opt==='object' && opt.short) ? opt.short : '';
      const a = abilities[id];
      const name = a ? a.name.replace(/\s*\(.*?\)\s*$/,'') : id;
      const active = chosen===id ? 'active' : '';
      return `<button class="ag-tile ${active}" onclick="selectAbilityChoice('${inst.instanceId}',${gi},'${id}')">
        <span class="agt-name">${name}</span>
        <span class="agt-short">${short}</span></button>`;
    }).join('') + `</div>`;
  });
  return out;
}
function selectAbilityChoice(instId, gi, id){
  const inst = armyList.find(i=>i.instanceId===instId); if(!inst) return;
  if(!inst.abilityChoices) inst.abilityChoices = {};
  inst.abilityChoices[gi] = id;       // select (one per group)
  saveState(); renderUnits();
  showModal(id);                      // full description popup
}

/* ---- Builder tab (full per-instance configuration) ---- */
function renderConfigurationTab(){
  renderDetachmentSelector();
  updateConfigPoints();
  const el = document.getElementById('config-list');
  let html = `<div class="cfg-actions">
    <button class="btn" onclick="openAddUnit()">+ Add Unit</button>
    <label class="config-label" style="margin:0">Points limit
      <input class="limit-input" type="number" min="0" step="5" value="${pointsLimit}"
        onchange="setPointsLimit(this.value)"></label>
  </div>`;
  if(!armyList.length){ html += `<div class="empty">Empty list — add a unit to begin.</div>`; }
  else html += armyList.map(renderArmyInstance).join('');
  el.innerHTML = html;
}

function renderArmyInstance(inst){
  const u = units[inst.unitId]; if(!u) return '';
  const collapsed = configExpandedCards[inst.instanceId] === false ? 'collapsed' : '';
  let body = '';

  // model count adjuster
  if(u.maxModels && u.maxModels > u.baseModels){
    body += `<div class="models-row"><span class="config-label">Models:</span>
      <div class="stepper sm">
        <button onclick="event.stopPropagation();changeModelCount('${inst.instanceId}',-1)" ${inst.modelCount<=u.baseModels?'disabled':''}>−</button>
        <span class="val">${inst.modelCount}</span>
        <button onclick="event.stopPropagation();changeModelCount('${inst.instanceId}',1)" ${inst.modelCount>=u.maxModels?'disabled':''}>+</button>
      </div></div>`;
  }

  // weapon loadout (equip toggle + count + expandable profile)
  body += renderLoadout(inst, u);

  // leader assignment (units that can be led) + the leader's enhancement;
  // otherwise the unit's own enhancement if it's an eligible character
  if((u.canBeLeadBy||[]).length){
    body += renderLeaderSelector(inst, u);
    if(inst.leaderId && units[inst.leaderId] && isEnhancementEligible(units[inst.leaderId]))
      body += renderInstanceEnhancementSelector(inst, inst.leaderId);
  } else if(isEnhancementEligible(u)){
    body += renderInstanceEnhancementSelector(inst, inst.unitId);
  }

  // wargear choices
  if((u.wargearChoices||[]).length) body += renderWargearChoices(inst, u);
  if((u.wargearExclusiveChoices||[]).length) body += renderWargearExclusive(inst, u);
  if((u.wargearOptions||[]).length)
    body += `<div class="config-label">Options</div>` +
      u.wargearOptions.map(o=>`<div style="font-size:.82rem;color:var(--muted)">${o}</div>`).join('');

  const menuOpen = menuOpenId===inst.instanceId;
  const menu = menuOpen ? `<div class="cc-menu-pop">
      <button onclick="event.stopPropagation();duplicateInstance('${inst.instanceId}')">Duplicate unit</button>
      <button class="danger" onclick="event.stopPropagation();removeInstance('${inst.instanceId}')">Remove unit</button>
    </div>` : '';

  return `<div class="config-card ${collapsed} ${menuOpen?'menu-open':''}">
    <div class="cc-head" onclick="toggleConfigCard('${inst.instanceId}')">
      <div class="cc-title">
        <h3>${u.name}</h3>
        <div class="cc-loadout">${loadoutSummary(inst, u)}</div>
      </div>
      <span class="pts-badge">${calculateInstancePoints(inst)} pts</span>
      <div class="cc-menu"><button class="cc-kebab" onclick="event.stopPropagation();toggleInstanceMenu('${inst.instanceId}')" title="Options">⋮</button>${menu}</div>
      <button class="cc-chevron" onclick="event.stopPropagation();toggleConfigCard('${inst.instanceId}')">▾</button>
    </div>
    <div class="cc-body">${body}</div>
  </div>`;
}

/* ---- weapon loadout ---- */
function weaponDefaultCount(u, inst, w){
  return (u.baseModels && w.count === u.baseModels) ? inst.modelCount : (w.count || 1);
}
function weaponState(inst, u, w){
  const st = inst.weapons[w.name] || {};
  return {
    equipped: st.equipped !== false,
    count: (st.count != null) ? st.count : weaponDefaultCount(u, inst, w),
  };
}
function loadoutSummary(inst, u){
  const parts = [];
  ['ranged','melee'].forEach(cat=>(u.weapons[cat]||[]).forEach(w=>{
    const s = weaponState(inst, u, w);
    if(s.equipped) parts.push(`${s.count}× ${w.name}`);
  }));
  return parts.join(', ') || '—';
}
function renderLoadout(inst, u){
  let out = '';
  for(const [cat,label] of [['ranged','Ranged Weapons'],['melee','Melee Weapons']]){
    const list = (u.weapons&&u.weapons[cat])||[]; if(!list.length) continue;
    out += `<div class="wgrp-label">${label}</div>`;
    list.forEach(w=>{
      const s = weaponState(inst, u, w);
      const key = inst.instanceId+'|'+w.name;
      const open = weaponDetailOpen[key];
      out += `<div class="wrow ${s.equipped?'':'off'}">
        <label class="wchk"><input type="checkbox" ${s.equipped?'checked':''}
          onchange="toggleWeaponEquip('${inst.instanceId}','${esc(w.name)}')"></label>
        <span class="wrow-name" title="${w.name}">${w.name}</span>
        <div class="wrow-ctrl">
          <div class="stepper sm">
            <button onclick="changeWeaponCount('${inst.instanceId}','${esc(w.name)}',-1)" ${s.count<=0?'disabled':''}>−</button>
            <span class="val">${s.count}</span>
            <button onclick="changeWeaponCount('${inst.instanceId}','${esc(w.name)}',1)">+</button>
          </div>
          <button class="wexpand ${open?'open':''}" onclick="toggleWeaponDetail('${inst.instanceId}','${esc(w.name)}')" title="Weapon profile">▾</button>
        </div>
      </div>`;
      if(open) out += `<div class="wdetail">${weaponDetailHtml(cat, w)}</div>`;
    });
  }
  return out;
}
function weaponDetailHtml(cat, w){
  const torrent = (w.abilities||[]).includes('torrent');
  const cols = cat==='ranged'
    ? [['RNG',w.range||'-'],['A',w.a],['BS',torrent?'N/A':(w.bs||'-')],['S',w.s],['AP',w.ap],['D',w.d]]
    : [['A',w.a],['WS',w.ws||'-'],['S',w.s],['AP',w.ap],['D',w.d]];
  return `<div class="wpn-stats">` +
    cols.map(([k,v])=>`<div class="ws"><b>${k}</b><span>${v}</span></div>`).join('') +
    `</div>` + (w.abilities&&w.abilities.length ? renderWeaponBadges(w) : '');
}
function esc(s){ return String(s).replace(/'/g,"\\'"); }

/* ---- loadout mutations ---- */
function ensureWeapon(inst, u, name){
  if(!inst.weapons[name]){
    const w = [].concat(u.weapons.ranged||[], u.weapons.melee||[]).find(x=>x.name===name);
    inst.weapons[name] = { equipped:true, count: w?weaponDefaultCount(u,inst,w):1 };
  }
  return inst.weapons[name];
}
function toggleWeaponEquip(id, name){
  const inst = armyList.find(i=>i.instanceId===id); const u = units[inst.unitId];
  const st = ensureWeapon(inst, u, name); st.equipped = !st.equipped;
  saveState(); renderApp();
}
function changeWeaponCount(id, name, delta){
  const inst = armyList.find(i=>i.instanceId===id); const u = units[inst.unitId];
  const st = ensureWeapon(inst, u, name);
  st.count = Math.max(0, st.count + delta);
  saveState(); renderApp();
}
function toggleWeaponDetail(id, name){
  const key = id+'|'+name; weaponDetailOpen[key] = !weaponDetailOpen[key];
  renderConfigurationTab();
}
function toggleConfigCard(id){
  configExpandedCards[id] = configExpandedCards[id] === false ? true : false;
  menuOpenId = null; renderConfigurationTab();
}
function toggleInstanceMenu(id){ menuOpenId = menuOpenId===id ? null : id; renderConfigurationTab(); }

/* ---- leader assignment ---- */
function renderLeaderSelector(inst, u){
  let html = `<div class="config-label">Assigned Leader</div>`;
  html += `<select class="leader-select" onchange="setLeader('${inst.instanceId}',this.value)">`;
  html += `<option value="">No leader</option>`;
  (u.canBeLeadBy||[]).forEach(lid=>{
    const l = units[lid]; if(!l) return;
    html += `<option value="${lid}" ${inst.leaderId===lid?'selected':''}>${l.name} (+${l.points} pts)</option>`;
  });
  html += `</select>`;
  if(inst.leaderId && units[inst.leaderId]) html += renderLeaderBonus(units[inst.leaderId]);
  return html;
}
function renderLeaderBonus(leader){
  const lb = leader.leaderBonus;
  let inner;
  if(lb && (lb.grantsAbilities||[]).length){
    inner = lb.grantsAbilities.map(g=>{
      const disp = typeof g==='string' ? (abilities[g]?abilities[g].name:g) : (g.display||g.id);
      const ap = (typeof g==='object' && g.abilityAppliesTo) ? ` (${g.abilityAppliesTo})` : '';
      return `<span class="lb-grant">${disp}${ap}</span>`;
    }).join(', ');
  } else if(lb && lb.short){ inner = lb.short; }
  else if(lb && lb.text){ inner = lb.text; }
  else { inner = `<span style="color:var(--muted)">${leader.name} — see datasheet for leading bonus.</span>`; }
  return `<div class="leader-bonus-box"><div class="lb-label">Leader Bonus</div><div class="lb-body">${inner}</div></div>`;
}
function setLeader(instId, lid){
  const inst = armyList.find(i=>i.instanceId===instId); if(!inst) return;
  inst.leaderId = lid || null;
  inst.enhancementId = null;   // enhancement belongs to the leader — reset on change
  saveState(); renderApp();
}

function isEnhancementEligible(u){
  if(u.isEpicHero) return false;
  const k = u.keywords.map(x=>x.toUpperCase());
  return u.isLeader || k.includes('CHARACTER');
}

/* enhancement filter + selector */
function getUsedEnhancements(exceptInstanceId){
  return armyList.filter(i=>i.instanceId!==exceptInstanceId && i.enhancementId).map(i=>i.enhancementId);
}
const GOD_KEYWORDS = ['KHORNE','NURGLE','TZEENTCH','SLAANESH','UNDIVIDED'];
function enhancementAllowedFor(enh, u){
  if(enh.detachment !== selectedDetachment) return false;
  const k = u.keywords.map(x=>x.toUpperCase());
  const restr = (enh.restriction||'').toUpperCase();
  // god-keyword restriction (derived from restriction text)
  for(const g of GOD_KEYWORDS){ if(restr.includes(g) && !k.includes(g)) return false; }
  if(/\bMONSTER\b/.test(restr) && !k.includes('MONSTER')) return false;
  // structured restrictedTo
  if(enh.restrictedTo && !enh.restrictedTo.includes(u.id)) return false;
  // weapon restriction
  if(enh.restrictedToWeapon){
    const wn = enh.restrictedToWeapon.toLowerCase();
    const all = [].concat(u.weapons.ranged||[], u.weapons.melee||[]);
    if(!all.some(w=>w.name.toLowerCase()===wn)) return false;
  }
  return true;
}
function renderInstanceEnhancementSelector(inst, characterId){
  const u = units[characterId];
  const used = getUsedEnhancements(inst.instanceId);
  const atMax = used.length >= 3;
  const options = Object.entries(enhancements)
    .filter(([id,e])=>enhancementAllowedFor(e,u))
    .filter(([id,e])=>!used.includes(id));   // hide ones taken elsewhere
  let html = `<div class="config-label">Enhancement</div><div class="enh-chips">`;
  options.forEach(([id,e])=>{
    const active = inst.enhancementId===id ? 'active' : '';
    html += `<button class="enh-chip ${active}" onclick="openEnhancement('${inst.instanceId}','${id}')" title="${e.name}">
      <span class="ec-short">${e.short}</span><span class="ec-pts">${e.points} pts</span></button>`;
  });
  html += `</div>`;
  if(atMax && !inst.enhancementId) html += `<div class="config-label" style="color:var(--accent)">Max 3 enhancements per army reached.</div>`;
  return html;
}

/* enhancement popup — full description + equip/remove */
function openEnhancement(instanceId, enhId){
  const inst = armyList.find(i=>i.instanceId===instanceId);
  const e = enhancements[enhId]; if(!inst || !e) return;
  const equipped = inst.enhancementId === enhId;
  const atMax = getUsedEnhancements(instanceId).length >= 3 && !equipped;
  const btn = atMax
    ? `<button class="btn ghost" disabled>Max 3 enhancements reached</button>`
    : `<button class="btn ${equipped?'ghost':''}" onclick="setEnhancement('${instanceId}','${enhId}');openEnhancement('${instanceId}','${enhId}')">${equipped?'✓ Equipped — remove':'Equip'}</button>`;
  showModalRaw(
    `${e.name} <span style="color:var(--accent-2);font-size:.85rem">${e.points} pts</span>`,
    e.type,
    `${e.restriction?`<div class="eo-restr">${e.restriction}</div>`:''}
     <div class="ed-desc">${e.description}</div>
     <div style="margin-top:1rem">${btn}</div>`
  );
}
function stripTags(s){ return (s||'').replace(/<[^>]+>/g,''); }

function renderWargearChoices(inst, u){
  const max = u.wargearMax || u.wargearChoices.length;
  let html = `<div class="config-label">Wargear (choose up to ${max})</div>`;
  u.wargearChoices.forEach(id=>{
    const a = abilities[id]; const checked = inst.selectedWargear.includes(id);
    html += `<label class="wargear-choice ${checked?'checked':''}">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleWargear('${inst.instanceId}','${id}',${max})"> ${a?a.name:id}</label>`;
  });
  return html;
}
function renderWargearExclusive(inst, u){
  let html = `<div class="config-label">Wargear (choose one)</div>`;
  u.wargearExclusiveChoices.forEach(id=>{
    const a = abilities[id]; const sel = inst.selectedWargear.includes(id);
    html += `<div class="wargear-exclusive-option ${sel?'selected':''}" onclick="selectExclusiveWargear('${inst.instanceId}','${id}')">${a?a.name:id}</div>`;
  });
  return html;
}

/* ---- builder mutations ---- */
function changeModelCount(id, delta){
  const inst = armyList.find(i=>i.instanceId===id); const u = units[inst.unitId];
  if(u.modelBrackets && u.modelBrackets.length){
    // snap to the previous / next legal bracket size
    const sizes = u.modelBrackets.map(b=>b.models);
    let idx = sizes.indexOf(inst.modelCount);
    if(idx < 0){ idx = sizes.findIndex(s=>s>=inst.modelCount); if(idx<0) idx = sizes.length-1; }
    idx = Math.max(0, Math.min(sizes.length-1, idx+delta));
    inst.modelCount = sizes[idx];
  } else {
    inst.modelCount = Math.max(u.baseModels, Math.min(u.maxModels||u.baseModels, inst.modelCount+delta));
  }
  saveState(); renderApp();
}
function setEnhancement(id, enhId){
  const inst = armyList.find(i=>i.instanceId===id);
  inst.enhancementId = (inst.enhancementId===enhId) ? null : enhId;
  saveState(); renderApp();
}
function setPointsLimit(v){ pointsLimit = parseInt(v,10)||0; saveState(); renderConfigurationTab(); }
function toggleWargear(id, wid, max){
  const inst = armyList.find(i=>i.instanceId===id);
  const i = inst.selectedWargear.indexOf(wid);
  if(i>=0) inst.selectedWargear.splice(i,1);
  else { if(inst.selectedWargear.length>=max) inst.selectedWargear.shift(); inst.selectedWargear.push(wid); }
  saveState(); renderApp();
}
function selectExclusiveWargear(id, wid){
  const inst = armyList.find(i=>i.instanceId===id); const u = units[inst.unitId];
  inst.selectedWargear = inst.selectedWargear.filter(w=>!u.wargearExclusiveChoices.includes(w));
  inst.selectedWargear.push(wid);
  saveState(); renderApp();
}

/* ---- add-unit picker ---- */
function openAddUnit(){
  let body = `<input class="picker-search" placeholder="Filter units…" oninput="filterPicker(this.value)" autofocus>
    <div id="picker-groups">${pickerGroupsHtml('')}</div>`;
  showModalRaw('Add Unit', '', body);
}
function pickerGroupsHtml(q){
  q = q.toLowerCase();
  const row = id=>`<div class="pick-row" onclick="addInstance('${id}');closeModal()">
      <span class="pick-name">${units[id].name}</span>
      <span class="pick-pts">${units[id].points} pts</span></div>`;
  const groupsFor = keep => {
    let html = '';
    for(const [grp,ids] of Object.entries(UNIT_GROUPS)){
      const matches = ids.filter(id=>keep(id) && units[id].name.toLowerCase().includes(q));
      if(!matches.length) continue;
      html += `<div class="pick-cat">${grp}</div>` + matches.map(row).join('');
    }
    return html;
  };
  const god = (detachments[selectedDetachment]||{}).god;
  let html;
  if(god){
    const inGod = id => units[id].keywords.map(x=>x.toUpperCase()).includes(god);
    html = groupsFor(inGod);
    const other = groupsFor(id=>!inGod(id));
    if(other) html += `<div class="pick-divider">Other Daemons</div>` + other;
  } else {
    html = groupsFor(()=>true);
  }
  return html || `<div class="empty">No matches</div>`;
}
function filterPicker(q){ document.getElementById('picker-groups').innerHTML = pickerGroupsHtml(q); }

/* ===================== Modal ===================== */
function showModal(id){
  let entry = abilities[id] || enhancements[id];
  if(!entry){ const d = Object.values(detachments).find(x=>x.ruleId===id);
    if(d) entry = { name:d.name, type:'Detachment Rule', description:renderRuleParts(d) }; }
  if(!entry) return;
  showModalRaw(entry.name, entry.type||'', entry.description||'');
}
function showModalRaw(title, sub, body){
  document.getElementById('modal-title').innerHTML = title;
  document.getElementById('modal-sub').innerHTML = sub;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

/* ===================== UI wiring ===================== */
function toggleCard(id){
  const willOpen = !expandedCards[id];
  expandedCards = {};              // accordion: collapse all others
  if(willOpen) expandedCards[id] = true;
  renderUnits();
  if(willOpen){
    const el = document.getElementById('uc-'+id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }
}
document.querySelectorAll('.tab-btn[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-btn[data-tab]').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('units-tab').classList.toggle('active', b.dataset.tab==='units');
  document.getElementById('config-tab').classList.toggle('active', b.dataset.tab==='config');
});
document.getElementById('theme-btn').onclick=()=>{
  const cur = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  localStorage.setItem(LS+'theme',cur);
};
document.getElementById('modal-overlay').onclick=e=>{ if(e.target.id==='modal-overlay') closeModal(); };
document.addEventListener('click',()=>{ if(menuOpenId){ menuOpenId=null; renderConfigurationTab(); } });

loadData().catch(e=>{ document.getElementById('loading').textContent='Failed to load data: '+e.message; console.error(e); });
</script>
